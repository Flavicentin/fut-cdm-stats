<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fut CDM · Admin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b09">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script>
    try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topo">
    <div class="topo-inner">
      <a href="./" class="logo" aria-label="Voltar ao site">
        <span class="logo-bola">⚽</span>
        <span class="logo-texto">FUT <b>CDM</b></span>
        <span class="logo-ano">ADMIN</span>
      </a>
      <div class="adm-usuario" id="usuario" hidden>
        <span id="usuario-email"></span>
        <button class="btn" id="btn-senha">Senha</button>
        <button class="btn" id="btn-sair">Sair</button>
      </div>
    </div>
  </header>

  <main class="adm">
    <div class="wrap">
      <p class="adm-carregando" id="carregando">Carregando…</p>

      <!-- LOGIN -->
      <section class="adm-cartao" id="tela-login" hidden>
        <p class="kicker">Área dos adms</p>
        <h1 class="adm-titulo">Entrar</h1>
        <p class="painel-desc">Acesso só para os adms. Entre com seu e-mail e senha; você continua logado neste navegador até clicar em Sair.</p>
        <form id="form-login" class="adm-form adm-form-coluna">
          <input type="email" id="login-email" required placeholder="seu@email.com" autocomplete="email" aria-label="E-mail">
          <input type="password" id="login-senha" required placeholder="Senha" autocomplete="current-password" aria-label="Senha">
          <button class="btn btn-primario" type="submit">Entrar</button>
        </form>
        <button class="adm-link" id="btn-link" type="button">Primeiro acesso ou esqueceu a senha? Receber código por e-mail</button>
        <p class="adm-msg" id="login-msg" role="status"></p>
        <form id="form-codigo" class="adm-form" hidden>
          <input id="login-codigo" inputmode="numeric" autocomplete="one-time-code" required placeholder="Código do e-mail" aria-label="Código do e-mail">
          <button class="btn btn-primario" type="submit">Entrar</button>
        </form>
      </section>

      <!-- PAINEL -->
      <section id="tela-painel" hidden>
        <header class="secao-cab">
          <div>
            <p class="kicker">Painel</p>
            <h1 class="adm-titulo" id="painel-titulo">Editar dados</h1>
          </div>
          <div class="adm-temporada">
            <label for="sel-temporada">Temporada</label>
            <select id="sel-temporada"></select>
            <input id="nova-temporada" placeholder="Nova (ex.: 2027)" size="10" aria-label="Nova temporada">
            <button class="btn" id="btn-nova-temporada">Criar</button>
          </div>
        </header>
        <form class="adm-senha" id="form-senha" hidden>
          <p class="adm-senha-titulo" id="senha-titulo">Criar ou trocar sua senha</p>
          <div class="adm-form">
            <input type="password" id="nova-senha" required minlength="8" placeholder="Nova senha (mín. 8)" autocomplete="new-password" aria-label="Nova senha">
            <input type="password" id="nova-senha-2" required minlength="8" placeholder="Repita a senha" autocomplete="new-password" aria-label="Repita a senha">
            <button class="btn btn-primario" type="submit">Salvar senha</button>
            <button class="btn" type="button" id="btn-senha-fechar">Agora não</button>
          </div>
          <p class="adm-msg" id="senha-msg" role="status"></p>
        </form>

        <div class="abas" id="abas" role="tablist">
          <button class="aba ativa" data-aba="temporada">📊 Temporada</button>
          <button class="aba" data-aba="mes">📅 Mês</button>
          <button class="aba" data-aba="honrarias">🏆 Honrarias</button>
          <button class="aba" data-aba="over">📝 Notas Over</button>
          <button class="aba" data-aba="admins">🔑 Admins</button>
        </div>

        <div id="conteudo"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
